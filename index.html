<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Đảo Đèn Lồng · Đèn cạn dầu</title></head>
<body><main id="game" aria-label="Game 3D Đảo Đèn Lồng"></main>
<section id="hud" hidden>
 <div class="hud-top"><div id="flames" aria-label="Ngọn Lửa"></div><time id="timer"></time><div><span id="lantern-count"></span><strong id="score"></strong></div></div>
 <div id="night-name"></div><div id="wind-warning" role="status"></div><div id="danger-indicator" role="status"></div>
 <div id="captions" role="status" aria-live="polite"></div><div id="spawn-arrows"></div>
 <div id="interaction"></div><div id="mote-bar" aria-label="Đom đóm"></div>
 <div id="cooldowns"><span id="dash-status"></span><span id="pulse-status"></span><span id="charm-status"></span></div>
 <div id="objective-arrow" hidden></div><div id="camera-help">Bấm vào đảo để xoay chuột · Esc/P tạm dừng</div>
</section>
<div id="overlay"><section id="panel" aria-live="polite"></section></div>
<div id="controls">WASD di chuyển · Chuột nhìn · Space nhảy · Shift lướt · E nạp/châm dầu · Q tỏa sáng · Esc/P tạm dừng</div>
<script type="module" src="/src/web/main.js"></script></body></html>
